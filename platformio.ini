; esp32.ftmsprobe — fernsteuerbarer GATT-Explorer fuer den BLE-Scan am Ergometer
;
; NimBLE bewusst auf 1.4.x gepinnt: gleiche API wie esp32.heartrate, damit der
; Code spaeter unveraendert nach esp32.ergo wandern kann. 2.x bricht die
; Callback-Signaturen.

[platformio]
default_envs = probe
src_dir = src

[env]
platform = espressif32@6.4.0
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DFW_VERSION=\"0.1.4\"
  -DHUB_HOST_DEFAULT=\"192.168.178.113\"
  -DHUB_PORT_DEFAULT=8093
  -DCORE_DEBUG_LEVEL=0
  -I include
  -I src
  ; Verbindungsbudget aus dem Pflichtenheft §14: Bike + Gurt + App.
  ; Die Sonde faehrt bewusst mit demselben Limit, damit der Test aussagekraeftig ist.
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  ; Peripheral/Broadcaster bleiben aus — die Sonde ist reiner Central.
  ; Fuer esp32.ergo v0.2 (FTMS-Bridge) muessen diese beiden Zeilen weg.
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_NIMBLE_CPP_DEBUG_ASSERT_ENABLED=0

[env:probe]
board = wemos_d1_mini32
board_build.partitions = min_spiffs.csv
build_flags =
  ${env.build_flags}
  -DPROBE_BOARD_MINI=1
  -DPROBE_LOG_SIZE=256

[env:probe-s3]
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
build_flags =
  ${env.build_flags}
  -DPROBE_BOARD_S3=1
  -DPROBE_LOG_SIZE=768
  -DARDUINO_USB_CDC_ON_BOOT=0
